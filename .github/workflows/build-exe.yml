name: Build Standalone Windows EXE

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build AndroidHealthDoctor.exe (with bundled ADB)
        run: |
          python build_exe.py

      - name: Upload AndroidHealthDoctor.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidHealthDoctor-Windows-Portable
          path: dist/AndroidHealthDoctor.exe

      - name: Publish to GitHub Release (on tag or main)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/AndroidHealthDoctor.exe
